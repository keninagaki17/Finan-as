<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Meu Saldo" />
  <title>Meu Saldo Diário</title>
  <style>
    :root {
      --bg:#f6f4ef; --card:#fff; --text:#202622; --muted:#747b77;
      --line:#e7e5de; --accent:#28483c; --accentSoft:#e8efeb;
      --danger:#a84646; --ken:#e7eef8; --vr:#e8f2e6; --maria:#f4e8ee;
      --shadow:0 12px 30px rgba(31,38,35,.07);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    body{padding-bottom:calc(83px + env(safe-area-inset-bottom))}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{width:min(100%,520px);margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px 24px}
    .hidden{display:none!important}
    .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
    .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:750;margin-bottom:6px}
    h1{margin:0;font-size:29px;line-height:1.05;letter-spacing:-.035em}
    h2{margin:0;font-size:17px}
    .user-actions{display:flex;gap:7px;align-items:center}
    .date-pill,.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.65);color:var(--muted);border-radius:999px}
    .date-pill{padding:8px 10px;font-size:11px;white-space:nowrap}
    .icon-btn{padding:8px 11px;font-size:12px;font-weight:650}
    .sync{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin:0 2px 13px}
    .dot{width:7px;height:7px;border-radius:50%;background:#4d8d72}
    .dot.off{background:#aaa}
    .total-card{background:var(--accent);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:13px}
    .total-card .label{font-size:13px;opacity:.7}
    .total-card .value{font-size:36px;font-weight:780;letter-spacing:-.045em;margin:6px 0 2px}
    .total-card .sub{font-size:12px;opacity:.66}
    .cards{display:grid;gap:10px;margin-bottom:13px}
    .balance-card{border:0;width:100%;text-align:left;border-radius:21px;padding:17px 18px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;color:var(--text);box-shadow:var(--shadow)}
    .ken{background:var(--ken)} .vr{background:var(--vr)} .maria{background:var(--maria)}
    .balance-card .name{font-size:14px;font-weight:730;margin-bottom:4px}
    .daily{font-size:12px;color:var(--muted)}
    .amount{font-size:22px;font-weight:780;letter-spacing:-.03em}
    .arrow{font-size:20px;color:var(--muted);margin-left:5px}
    .primary{width:100%;border:0;border-radius:18px;padding:16px 18px;background:var(--accent);color:#fff;font-size:15px;font-weight:740;box-shadow:var(--shadow)}
    .primary:disabled{opacity:.45;cursor:default}
    .secondary{width:100%;border:1px solid var(--line);border-radius:17px;padding:15px 18px;background:#fff;color:var(--accent);font-weight:730}
    .next-day{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}
    .section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:25px 2px 10px}
    .section-title span{font-size:11px;color:var(--muted)}
    .activity-card,.notice{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
    .activity-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
    .activity-row:last-child{border-bottom:0}
    .title{font-size:14px;font-weight:660}
    .meta{font-size:11px;color:var(--muted);margin-top:3px}
    .money{font-size:14px;font-weight:730} .positive{color:var(--accent)} .negative{color:var(--danger)}
    .empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:13px}
    .notice{padding:17px;margin-bottom:13px}
    .notice strong{display:block;margin-bottom:4px}
    .notice p{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 11px}
    .small-btn{border:0;border-radius:13px;background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:730;padding:10px 12px}
    .detail-header{margin-bottom:18px}
    .back{border:0;background:transparent;color:var(--muted);font-weight:680;padding:4px 0 13px}
    .detail-balance{border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:12px}
    .detail-balance .amount{font-size:35px;margin:5px 0 2px}
    .debit-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:14px 15px;border-bottom:1px solid var(--line)}
    .debit-row:last-child{border-bottom:0}
    .delete{border:0;background:transparent;color:#989d99;font-size:20px;padding:3px 3px 3px 8px}
    .bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:20;width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(246,244,239,.89);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(225,223,216,.75)}
    .nav-btn{border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 3px 7px;font-size:10px}
    .nav-btn .icon{font-size:18px;line-height:1;margin-bottom:4px}
    .nav-btn.active{color:var(--accent);background:rgba(40,72,60,.07);font-weight:730}
    .modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,27,24,.34);display:none;align-items:flex-end;justify-content:center;padding:12px}
    .modal-wrap.open{display:flex}
    .modal{width:min(100%,500px);background:#fff;border-radius:26px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 24px 80px rgba(0,0,0,.18)}
    .modal h3{margin:0 0 5px;font-size:21px}
    .help{font-size:12px;line-height:1.45;color:var(--muted);margin-bottom:17px}
    .field{margin-bottom:13px}
    .field label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin:0 0 6px 2px}
    .field input{width:100%;border:1px solid var(--line);background:#faf9f6;border-radius:15px;padding:13px 14px;color:var(--text);outline:none}
    .field input:focus{border-color:#aab8b1;background:#fff}
    .modal-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:16px}
    .cancel{border:0;border-radius:15px;padding:14px;background:#f1f0ec;color:var(--text);font-weight:700}
    .toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:80;background:#202723;color:#fff;padding:11px 15px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .login-shell{min-height:calc(100vh - env(safe-area-inset-top));display:flex;align-items:center;justify-content:center}
    .login-box{width:100%;padding:12px 0 80px}
    .login-mark{width:48px;height:48px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:780;margin-bottom:20px}
    .login-box h1{font-size:32px;margin-bottom:8px}
    .login-box>p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 24px;max-width:340px}
    .login-btn{margin-top:5px}
    .login-note{text-align:center;color:var(--muted);font-size:11px;line-height:1.45;margin-top:13px}
    .error-box{background:#f8eaea;color:#873b3b;border-radius:14px;padding:11px 13px;font-size:12px;margin-bottom:13px;display:none}
    .loading{min-height:72vh;display:grid;place-items:center;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main class="app" id="app"><div class="loading">Conectando…</div></main>

  <nav class="bottom-nav hidden" id="bottomNav">
    <button class="nav-btn active" data-view="home"><div class="icon">⌂</div>Início</button>
    <button class="nav-btn" data-view="ken"><div class="icon">◒</div>Ken</button>
    <button class="nav-btn" data-view="vr"><div class="icon">◉</div>VR</button>
    <button class="nav-btn" data-view="maria"><div class="icon">◐</div>Maria Clara</button>
  </nav>

  <div class="modal-wrap" id="debitModal">
    <div class="modal">
      <h3>Adicionar débito</h3>
      <div class="help" id="debitHelp"></div>
      <div class="field"><label>Valor</label><input id="debitValue" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00"></div>
      <div class="field"><label>Descrição</label><input id="debitDesc" type="text" maxlength="60" placeholder="Ex.: Uber, mercado, almoço"></div>
      <div class="field"><label>Data</label><input id="debitDate" type="date"></div>
      <div class="modal-actions"><button class="cancel" data-close="debitModal">Cancelar</button><button class="primary" id="saveDebitBtn">Adicionar</button></div>
    </div>
  </div>

  <div class="modal-wrap" id="startModal">
    <div class="modal">
      <h3>Começar controle</h3>
      <div class="help">Escolha o primeiro dia. Nesse dia entram R$ 70 no Débito Ken, R$ 41 no VR Ken e R$ 30 no Débito Maria Clara.</div>
      <div class="field"><label>Primeiro dia</label><input id="startDate" type="date"></div>
      <div class="modal-actions"><button class="cancel" data-close="startModal">Cancelar</button><button class="primary" id="startBtn">Começar</button></div>
    </div>
  </div>

  <div class="modal-wrap" id="creditModal">
    <div class="modal">
      <h3>Adicionar saldo do dia</h3>
      <div class="help" id="creditHelp"></div>
      <div class="activity-card">
        <div class="activity-row"><div class="title">Débito Ken</div><div class="money positive">+ R$ 70,00</div></div>
        <div class="activity-row"><div class="title">VR Ken</div><div class="money positive">+ R$ 41,00</div></div>
        <div class="activity-row"><div class="title">Débito Maria Clara</div><div class="money positive">+ R$ 30,00</div></div>
      </div>
      <div class="modal-actions"><button class="cancel" data-close="creditModal">Cancelar</button><button class="primary" id="creditBtn">Adicionar</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/+esm";

    const SUPABASE_URL = "https://owjuihjcypqonvlpsgqu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_kbAOka2sxT40KPWgaXEA0g_adwNHUtv";
    const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const ACCOUNTS = {
      ken: { name:"Débito Ken", daily:70, cls:"ken" },
      vr: { name:"VR Ken", daily:41, cls:"vr" },
      maria: { name:"Débito Maria Clara", daily:30, cls:"maria" }
    };

    let session = null;
    let householdId = null;
    let credits = [];
    let debits = [];
    let currentView = "home";
    let currentDebitAccount = null;
    let channel = null;
    let busy = false;

    const $ = s => document.querySelector(s);
    const money = n => Number(n||0).toLocaleString("pt-BR", {style:"currency",currency:"BRL"});
    const todayISO = () => {
      const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    };
    const parseISO = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
    const formatDate = iso => parseISO(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
    const addDays = (iso,n) => {
      const d=parseISO(iso); d.setDate(d.getDate()+n);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    };
    const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

    function toast(msg) {
      const el=$("#toast"); el.textContent=msg; el.classList.add("show");
      clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove("show"),2200);
    }
    function setBusy(v) { busy=v; }
    function openModal(id) { $("#"+id).classList.add("open"); }
    function closeModal(id) { $("#"+id).classList.remove("open"); }

    function balance(account) {
      return credits.length * ACCOUNTS[account].daily
        - debits.filter(d=>d.account===account).reduce((s,d)=>s+Number(d.amount),0);
    }
    function totalBalance() { return Object.keys(ACCOUNTS).reduce((s,k)=>s+balance(k),0); }
    function nextCreditDate() {
      if (!credits.length) return null;
      const dates=credits.map(c=>c.credit_date).sort();
      return addDays(dates[dates.length-1],1);
    }
    function latestActivity(limit=6) {
      const items=[
        ...credits.map(c=>({type:"credit",date:c.credit_date,created_at:c.created_at})),
        ...debits.map(d=>({type:"debit",...d,date:d.debit_date}))
      ];
      return items.sort((a,b)=>b.date.localeCompare(a.date)||(b.created_at||"").localeCompare(a.created_at||"")).slice(0,limit);
    }

    function showLogin(error="") {
      $("#bottomNav").classList.add("hidden");
      $("#app").innerHTML=`
        <div class="login-shell"><div class="login-box">
          <div class="login-mark">R$</div>
          <div class="eyebrow">Controle compartilhado</div>
          <h1>Meu saldo diário</h1>
          <p>Entre para visualizar e atualizar os mesmos saldos nos dois celulares.</p>
          <div class="error-box" id="loginError" style="${error?"display:block":""}">${esc(error)}</div>
          <form id="loginForm">
            <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email" required placeholder="seu@email.com"></div>
            <div class="field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
            <button class="primary login-btn" type="submit">Entrar</button>
          </form>
          <div class="login-note">Não existe cadastro público neste site.<br>Use um dos dois usuários autorizados no Supabase.</div>
        </div></div>`;
      $("#loginForm").addEventListener("submit", login);
    }

    async function login(e) {
      e.preventDefault();
      const email=$("#loginEmail").value.trim();
      const password=$("#loginPassword").value;
      const btn=e.submitter; btn.disabled=true; btn.textContent="Entrando…";
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error) {
        btn.disabled=false; btn.textContent="Entrar";
        $("#loginError").style.display="block";
        $("#loginError").textContent="E-mail ou senha incorretos.";
        return;
      }
      session=data.session;
      await afterLogin();
    }

    async function logout() {
      if(channel) await sb.removeChannel(channel);
      await sb.auth.signOut();
      session=null; householdId=null; credits=[]; debits=[];
      showLogin();
    }

    async function afterLogin() {
      $("#app").innerHTML='<div class="loading">Carregando saldos…</div>';
      const user=session?.user;
      if(!user) return showLogin();

      const {data,error}=await sb
        .from("household_members")
        .select("household_id")
        .eq("user_id",user.id)
        .maybeSingle();

      if(error || !data) {
        await sb.auth.signOut();
        session=null;
        return showLogin("Este usuário ainda não foi vinculado ao controle. Rode o arquivo 02_vincular_usuarios.sql no Supabase.");
      }

      householdId=data.household_id;
      $("#bottomNav").classList.remove("hidden");
      await loadData(true);
      subscribeRealtime();
    }

    async function loadData(first=false) {
      if(!householdId) return;
      const [cRes,dRes]=await Promise.all([
        sb.from("daily_credits").select("id,credit_date,created_at").eq("household_id",householdId).order("credit_date",{ascending:true}),
        sb.from("debits").select("id,account,amount,description,debit_date,created_at").eq("household_id",householdId).order("debit_date",{ascending:false})
      ]);
      if(cRes.error || dRes.error) {
        console.error(cRes.error||dRes.error);
        if(first) toast("Não foi possível carregar os dados.");
        return;
      }
      credits=cRes.data||[];
      debits=dRes.data||[];
      render();
    }

    function subscribeRealtime() {
      if(channel) sb.removeChannel(channel);
      channel=sb.channel("financas-compartilhadas")
        .on("postgres_changes",{event:"*",schema:"public",table:"daily_credits"},()=>loadData())
        .on("postgres_changes",{event:"*",schema:"public",table:"debits"},()=>loadData())
        .subscribe();
    }

    function accountCard(key) {
      const a=ACCOUNTS[key];
      return `<button class="balance-card ${a.cls}" data-go="${key}">
        <div><div class="name">${a.name}</div><div class="daily">+ ${money(a.daily)} por dia</div></div>
        <div style="display:flex;align-items:center"><div class="amount">${money(balance(key))}</div><div class="arrow">›</div></div>
      </button>`;
    }

    function recentHTML() {
      const items=latestActivity();
      if(!items.length) return '<div class="activity-card"><div class="empty">As movimentações vão aparecer aqui.</div></div>';
      return `<div class="activity-card">${items.map(x=>x.type==="credit"
        ? `<div class="activity-row"><div><div class="title">Saldo do dia</div><div class="meta">${formatDate(x.date)} · +70 Ken · +41 VR · +30 Maria Clara</div></div><div class="money positive">+ ${money(131)}</div></div>`
        : `<div class="activity-row"><div><div class="title">${esc(x.description)}</div><div class="meta">${formatDate(x.date)} · ${ACCOUNTS[x.account].name}</div></div><div class="money negative">− ${money(x.amount)}</div></div>`
      ).join("")}</div>`;
    }

    function renderHome() {
      const now=new Date();
      const dateLabel=now.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}).replaceAll(".","");
      const next=nextCreditDate();
      $("#app").innerHTML=`
        <div class="topline">
          <div><div class="eyebrow">Controle pessoal</div><h1>Meu saldo diário</h1></div>
          <div class="user-actions"><div class="date-pill">${dateLabel}</div><button class="icon-btn" id="logoutBtn">Sair</button></div>
        </div>
        <div class="sync"><span class="dot ${navigator.onLine?"":"off"}"></span>${navigator.onLine?"Sincronizado online":"Sem conexão"}</div>

        ${!credits.length ? `<div class="notice"><strong>Defina o primeiro dia</strong><p>O primeiro lançamento adiciona R$ 70, R$ 41 e R$ 30 aos três saldos.</p><button class="small-btn" id="openStart">Começar controle</button></div>` : ""}

        <section class="total-card">
          <div class="label">Saldo disponível total</div>
          <div class="value">${money(totalBalance())}</div>
          <div class="sub">${credits.length ? `${credits.length} dia${credits.length===1?"":"s"} de saldo adicionado${credits.length===1?"":"s"}` : "Ainda não iniciado"}</div>
        </section>

        <section class="cards">${accountCard("ken")}${accountCard("vr")}${accountCard("maria")}</section>

        <button class="primary" id="openCredit" ${credits.length?"":"disabled"}>+ Adicionar saldo do dia</button>
        <div class="next-day">${credits.length ? `Próximo saldo: ${formatDate(next)}` : "Escolha primeiro a data inicial"}</div>

        <div class="section-title"><h2>Movimentações recentes</h2><span>${latestActivity().length?"últimas":""}</span></div>
        ${recentHTML()}`;

      $("#logoutBtn").addEventListener("click",logout);
      $("#openStart")?.addEventListener("click",()=>{
        const d=new Date(); d.setDate(1);
        $("#startDate").value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
        openModal("startModal");
      });
      $("#openCredit").addEventListener("click",()=>{
        if(!credits.length) return;
        $("#creditHelp").textContent=`Será adicionado o saldo referente a ${formatDate(nextCreditDate())}.`;
        openModal("creditModal");
      });
      document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>goTo(b.dataset.go)));
    }

    function renderAccount(key) {
      const a=ACCOUNTS[key];
      const list=debits.filter(d=>d.account===key).sort((x,y)=>y.debit_date.localeCompare(x.debit_date)||(y.created_at||"").localeCompare(x.created_at||""));
      const spentToday=list.filter(d=>d.debit_date===todayISO()).reduce((s,d)=>s+Number(d.amount),0);

      $("#app").innerHTML=`
        <div class="detail-header"><button class="back" id="backBtn">‹ Voltar</button><div class="eyebrow">Movimentações</div><h1>${a.name}</h1></div>
        <div class="detail-balance ${a.cls}">
          <div class="daily">Saldo disponível</div><div class="amount">${money(balance(key))}</div>
          <div class="daily">+ ${money(a.daily)} por dia · gasto hoje: ${money(spentToday)}</div>
        </div>
        <button class="secondary" id="openDebit">− Adicionar débito</button>
        <div class="section-title"><h2>Débitos</h2><span>${list.length?`${list.length} lançamento${list.length===1?"":"s"}`:""}</span></div>
        <div class="activity-card">${list.length ? list.map(d=>`
          <div class="debit-row"><div><div class="title">${esc(d.description)}</div><div class="meta">${formatDate(d.debit_date)}</div></div>
          <div class="money negative">− ${money(d.amount)}</div><button class="delete" data-delete="${d.id}" aria-label="Excluir">×</button></div>`).join("")
          : '<div class="empty">Nenhum débito lançado ainda.</div>'}</div>`;

      $("#backBtn").addEventListener("click",()=>goTo("home"));
      $("#openDebit").addEventListener("click",()=>{
        currentDebitAccount=key; $("#debitHelp").textContent=a.name; $("#debitValue").value=""; $("#debitDesc").value=""; $("#debitDate").value=todayISO(); openModal("debitModal");
        setTimeout(()=>$("#debitValue").focus(),180);
      });
      document.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>deleteDebit(b.dataset.delete)));
    }

    function render() {
      if(!session || !householdId) return;
      currentView==="home" ? renderHome() : renderAccount(currentView);
      document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
    }

    function goTo(view) {
      currentView=view; render(); window.scrollTo({top:0,behavior:"smooth"});
    }

    async function addFirstDay() {
      if(busy) return;
      const date=$("#startDate").value;
      if(!date) return toast("Escolha uma data.");
      setBusy(true); $("#startBtn").disabled=true;
      const {error}=await sb.from("daily_credits").insert({household_id:householdId,credit_date:date,created_by:session.user.id});
      setBusy(false); $("#startBtn").disabled=false;
      if(error) {
        if(error.code==="23505") toast("Esse dia já foi adicionado.");
        else {console.error(error);toast("Não foi possível começar.");}
        return;
      }
      closeModal("startModal"); await loadData(); toast("Primeiro saldo adicionado.");
    }

    async function addDailyCredit() {
      if(busy || !credits.length) return;
      const date=nextCreditDate();
      setBusy(true); $("#creditBtn").disabled=true;
      const {error}=await sb.from("daily_credits").insert({household_id:householdId,credit_date:date,created_by:session.user.id});
      setBusy(false); $("#creditBtn").disabled=false;
      if(error) {
        if(error.code==="23505") {closeModal("creditModal");await loadData();toast("Esse dia já foi adicionado por vocês.");}
        else {console.error(error);toast("Não foi possível adicionar.");}
        return;
      }
      closeModal("creditModal"); await loadData(); toast(`Saldo de ${formatDate(date)} adicionado.`);
    }

    async function saveDebit() {
      if(busy || !currentDebitAccount) return;
      const amount=Number($("#debitValue").value);
      const description=$("#debitDesc").value.trim()||"Débito";
      const debit_date=$("#debitDate").value;
      if(!amount || amount<=0) return toast("Informe um valor válido.");
      if(!debit_date) return toast("Informe a data.");

      setBusy(true); $("#saveDebitBtn").disabled=true;
      const {error}=await sb.from("debits").insert({
        household_id:householdId, account:currentDebitAccount, amount:Number(amount.toFixed(2)),
        description, debit_date, created_by:session.user.id
      });
      setBusy(false); $("#saveDebitBtn").disabled=false;
      if(error) {console.error(error);return toast("Não foi possível adicionar o débito.");}
      closeModal("debitModal"); await loadData(); toast("Débito adicionado.");
    }

    async function deleteDebit(id) {
      const item=debits.find(d=>d.id===id);
      if(!item || !confirm(`Excluir "${item.description}" de ${money(item.amount)}?`)) return;
      const {error}=await sb.from("debits").delete().eq("id",id).eq("household_id",householdId);
      if(error) {console.error(error);return toast("Não foi possível excluir.");}
      await loadData(); toast("Débito excluído.");
    }

    $("#bottomNav").addEventListener("click",e=>{const b=e.target.closest(".nav-btn");if(b)goTo(b.dataset.view)});
    $("#startBtn").addEventListener("click",addFirstDay);
    $("#creditBtn").addEventListener("click",addDailyCredit);
    $("#saveDebitBtn").addEventListener("click",saveDebit);
    document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
    document.querySelectorAll(".modal-wrap").forEach(w=>w.addEventListener("click",e=>{if(e.target===w)w.classList.remove("open")}));
    window.addEventListener("online",render); window.addEventListener("offline",render);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden && session && householdId)loadData()});

    const {data:{session:initialSession}}=await sb.auth.getSession();
    session=initialSession;
    if(session) await afterLogin(); else showLogin();

    sb.auth.onAuthStateChange((event,newSession)=>{
      if(event==="SIGNED_OUT" && !newSession) showLogin();
    });
  </script>
</body>
</html>
